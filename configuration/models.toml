# Model registry, routing, saved hardware observations, and memory settings.
# Keep registry keys stable: routing maps refer to them.
# Optional values such as unknown RAM/VRAM estimates are omitted (TOML has no null).
# endpoint_env/api_key_env name variables in .env; never put credentials here.
# requests_per_model applies to streaming; batch mode uses one request at a time.

# Registry key of the startup/routing agent. Use "" to disable all MainAgent calls.
# Also set think_sorting=false in run.toml when disabling MainAgent with multiple candidate models.
main_agent = "main_agent"
fallback_vlm = "chart_reader"
fallback_formatter = "chart_formatter"
# Memory reserved for the application and other overhead; model estimates must include inference overhead.
memory_reserve_gib = 2

